<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>T'Smoakt CRM</title>
  <meta name="theme-color" content="#ed4f36">
  <link rel="icon" href="../assets/logo.webp">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="catalog.css">
  <link rel="stylesheet" href="catalog-edit.css">
  <link rel="stylesheet" href="admin-v2.css">
  <link rel="stylesheet" href="search-archive.css">
  <style>[hidden]{display:none!important}</style>
</head>
<body>
  <div id="login" class="login-screen">
    <img src="../assets/logo.webp" alt="T'Smoakt">
    <h1>T'Smoakt CRM</h1>
    <p>Meld aan met een toegelaten Google-account.</p>
    <button id="login-btn" class="primary">Aanmelden met Google</button>
    <small id="login-error"></small>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand"><img src="../assets/logo.webp" alt=""><div><strong>T'Smoakt</strong><span>Catering CRM</span></div></div>
      <nav>
        <button class="nav active" data-view="board">Aanvragen</button>
        <button class="nav" data-view="archive">Archief</button>
        <button class="nav" data-view="calendar">Kalender</button>
        <button class="nav" data-view="catalog">Formules</button>
        <button class="nav" data-view="staff">Medewerkers</button>
        <button class="nav" data-view="products">Producten</button>
        <button class="nav" data-view="suppliers">Leveranciers</button>
      </nav>
      <div class="top-actions"><button id="new-btn" class="primary">+ Nieuwe aanvraag</button><button id="logout-btn" class="avatar" title="Afmelden">KB</button></div>
    </header>

    <main>
      <section class="global-search"><label for="global-search">Zoek in alle dossiers</label><input id="global-search" type="search" placeholder="Naam, e-mail, locatie, formule, product, notitie…"><div id="global-results" hidden></div></section>
      <section class="stats" id="stats"></section>
      <section id="board-view" class="app-view">
        <div class="view-head"><div><h1>Aanvragen</h1><p>Sleep dossiers tussen de kolommen of open ze voor alle details.</p></div><label class="search">Zoeken<input id="search" type="search" placeholder="Naam, locatie of formule"></label></div>
        <div id="board" class="board"></div>
      </section>
      <section id="calendar-view" class="app-view" hidden></section>
      <section id="archive-view" class="app-view" hidden></section>
      <section id="staff-view" class="app-view" hidden></section>
      <section id="products-view" class="app-view" hidden></section>
      <section id="suppliers-view" class="app-view" hidden></section>
    </main>
  </div>

  <dialog id="request-dialog">
    <form method="dialog" id="request-form">
      <header><h2>Nieuwe aanvraag</h2><button value="cancel" aria-label="Sluiten">×</button></header>
      <div class="form-grid">
        <label>Naam klant<input name="customerName" required></label>
        <label>E-mail<input name="email" type="email" required></label>
        <label>Telefoon<input name="phone"></label>
        <label>Locatie<input name="location"></label>
        <label>Datum evenement<input name="eventDate" type="date"></label>
        <label>Uur evenement<input name="eventTime" type="time"></label>
        <label>Aantal volwassenen<input name="adults" type="number" min="0"></label>
        <label>Aantal kinderen<input name="children" type="number" min="0"></label>
        <label>Bediening<select name="service"><option value="">Nog te bepalen</option><option>Met bediening</option><option>Zonder bediening</option></select></label>
        <label>Bron<select name="source"><option value="admin">Manueel</option><option value="website">Website</option><option value="email">E-mail</option><option value="phone">Telefoon</option></select></label>
        <label class="full">Medewerkers<select name="assignedTo" multiple size="3"></select></label>
        <label class="full">Opmerkingen<textarea name="notes" rows="4"></textarea></label>
      </div>
      <footer><button value="cancel">Annuleren</button><button class="primary" value="default">Dossier aanmaken</button></footer>
    </form>
  </dialog>

  <aside id="drawer" class="drawer" aria-hidden="true"><button id="drawer-close" class="drawer-close">×</button><div id="drawer-content"></div></aside>
  <div id="backdrop" class="backdrop" hidden></div>
  <script type="module" src="admin.js"></script>
  <script type="module" src="directory.js"></script>
  <script type="module" src="catalog.js"></script>
  <script type="module" src="calendar.js"></script>
</body>
</html>
