name: Website publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bouw statische pagina's
        run: python3 build.py
      - name: Controleer inhoud en links
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/check_site.py
          node --test tests/catalog.test.mjs
          node --check admin/admin.js
          node --check admin/catalog.js
          node --check admin/directory.js
          node --check site.js
          node --check category.js
          node --check kerst/kerst.js
      - name: GitHub Pages instellen
        uses: actions/configure-pages@v5
      - name: Website uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Website publiceren
        id: deployment
        uses: actions/deploy-pages@v4
